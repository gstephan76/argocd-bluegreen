apiVersion: apps/v1
kind: Deployment
metadata:
  name: metric-ai-kubernetes-agent
  namespace: openshift-gitops
  labels:
    app: metric-ai-kubernetes-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metric-ai-kubernetes-agent
  template:
    metadata:
      labels:
        app: metric-ai-kubernetes-agent
    spec:
      serviceAccountName: metric-ai-kubernetes-agent
      containers:
        - name: agent
          # Pin the exact upstream Quay image verified by this demo so a
          # presentation cannot drift when the mutable latest tag changes.
          image: quay.io/kevindubois/kubernetes-agent@sha256:ec942d19e381d25435ca6184e4fe9d203208106567345b722c60108520fc0dd3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ANALYSIS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: metric-ai-kubernetes-agent
                  key: analysis_api_key
            - name: ANALYSIS_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: metric-ai-kubernetes-agent
                  key: analysis_base_url
            - name: ANALYSIS_MODEL
              valueFrom:
                secretKeyRef:
                  name: metric-ai-kubernetes-agent
                  key: analysis_model
            - name: REMEDIATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: metric-ai-kubernetes-agent
                  key: remediation_api_key
                  optional: true
            - name: REMEDIATION_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: metric-ai-kubernetes-agent
                  key: remediation_base_url
                  optional: true
            - name: REMEDIATION_MODEL
              valueFrom:
                secretKeyRef:
                  name: metric-ai-kubernetes-agent
                  key: remediation_model
                  optional: true
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: metric-ai-github-bootstrap
                  key: github_token
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /q/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /q/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
