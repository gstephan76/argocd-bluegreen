apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: metric-ai-analysis
  namespace: metric-ai-demo
spec:
  metrics:
    - name: ai-canary-analysis
      failureLimit: 0
      count: 1
      initialDelay: 5s
      provider:
        plugin:
          argoproj-labs/metric-ai:
            agentUrl: http://metric-ai-kubernetes-agent.openshift-gitops.svc.cluster.local:8080
            stableLabel: app=metric-ai-demo,role=stable
            canaryLabel: app=metric-ai-demo,role=canary
            extraPrompt: >-
              Compare the canary against the stable pods. Focus on new exceptions,
              failed requests, latency/resource degradation, and user-facing impact.
              Treat cosmetic/version differences as expected. Recommend promotion
              only when the canary is at least as healthy as stable.

            # Optional remediation from the upstream demo:
            # githubUrl: https://github.com/<your-user>/argo-rollouts-quarkus-demo
            # baseBranch: main
            #
            # Enable only after configuring a writable fork and GITHUB_TOKEN.
