apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rollouts-canary-demo
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/gstephan76/argocd-bluegreen.git
    targetRevision: main
    path: canary-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: rollouts-canary-demo

  # Argo Rollouts owns this selector on the canary-only Service.
  ignoreDifferences:
    - group: ""
      kind: Service
      name: rollouts-canary-demo-canary
      namespace: rollouts-canary-demo
      jqPathExpressions:
        - '.spec.selector."rollouts-pod-template-hash"'

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
