apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rollouts-mesh-canary-demo
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/gstephan76/argocd-bluegreen.git
    targetRevision: main
    path: canary-mesh-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: rollouts-mesh-canary-demo

  # Argo Rollouts owns the ReplicaSet hash selectors on both Services and the
  # runtime weights on the Istio VirtualService. Argo CD must not self-heal
  # those fields back to the Git baseline while a rollout is in progress.
  ignoreDifferences:
    - group: ""
      kind: Service
      name: rollouts-mesh-canary-stable
      namespace: rollouts-mesh-canary-demo
      jqPathExpressions:
        - '.spec.selector."rollouts-pod-template-hash"'
    - group: ""
      kind: Service
      name: rollouts-mesh-canary-canary
      namespace: rollouts-mesh-canary-demo
      jqPathExpressions:
        - '.spec.selector."rollouts-pod-template-hash"'
    - group: networking.istio.io
      kind: VirtualService
      name: rollouts-mesh-canary
      namespace: rollouts-mesh-canary-demo
      jqPathExpressions:
        - '.spec.http[] | select(.name == "primary") | .route[].weight'

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
