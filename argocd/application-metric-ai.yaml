apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metric-ai-demo
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/gstephan76/argocd-bluegreen.git
    targetRevision: main
    path: metric-ai-demo/app
  destination:
    server: https://kubernetes.default.svc
    namespace: metric-ai-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
