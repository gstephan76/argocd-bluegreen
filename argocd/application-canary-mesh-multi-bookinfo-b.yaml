apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canary-mesh-multi-bookinfo-b
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/gstephan76/argocd-bluegreen.git
    targetRevision: main
    path: canary-mesh-multi-bookinfo/bookinfo-b
  destination:
    server: https://kubernetes.default.svc
    namespace: canary-mesh-multi-bookinfo

  # Argo Rollouts owns Bookinfo B's runtime hash selectors and traffic weights.
  ignoreDifferences:
    - group: ""
      kind: Service
      name: bookinfo-b-productpage-stable
      namespace: canary-mesh-multi-bookinfo
      jqPathExpressions:
        - '.spec.selector."rollouts-pod-template-hash"'
    - group: ""
      kind: Service
      name: bookinfo-b-productpage-canary
      namespace: canary-mesh-multi-bookinfo
      jqPathExpressions:
        - '.spec.selector."rollouts-pod-template-hash"'
    - group: networking.istio.io
      kind: VirtualService
      name: bookinfo-b
      namespace: canary-mesh-multi-bookinfo
      jqPathExpressions:
        - '.spec.http[] | select(.name == "primary") | .route[].weight'

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
