apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollouts-mesh-canary-demo
  namespace: rollouts-mesh-canary-demo
spec:
  # With an Istio traffic router, traffic weight is independent of the
  # stable/canary pod ratio. Four replicas are enough to demonstrate exact
  # request-level percentages such as 10% and 25%.
  replicas: 4
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: rollouts-mesh-canary-demo
  template:
    metadata:
      labels:
        app: rollouts-mesh-canary-demo
      annotations:
        demo-rollout-revision: "mesh-baseline-blue"
    spec:
      containers:
        - name: rollouts-demo
          image: argoproj/rollouts-demo:blue
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
  strategy:
    canary:
      stableService: rollouts-mesh-canary-stable
      canaryService: rollouts-mesh-canary-canary
      maxUnavailable: 0
      maxSurge: 1
      trafficRouting:
        istio:
          virtualService:
            name: rollouts-mesh-canary
            routes:
              - primary
      steps:
        - setWeight: 10
        - analysis:
            templates:
              - templateName: rollouts-mesh-canary-prometheus

        - setWeight: 25
        - analysis:
            templates:
              - templateName: rollouts-mesh-canary-prometheus

        - setWeight: 50
        - analysis:
            templates:
              - templateName: rollouts-mesh-canary-prometheus

        - setWeight: 75
        - analysis:
            templates:
              - templateName: rollouts-mesh-canary-prometheus

        - setWeight: 100
        - analysis:
            templates:
              - templateName: rollouts-mesh-canary-prometheus

        # All five health gates have passed, but the candidate does not become
        # stable until the operator explicitly promotes this final pause.
        - pause: {}
