apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: canary-mesh-multi-bookinfo-gateway
  namespace: canary-mesh-multi-bookinfo
spec:
  selector:
    istio: ingressgateway
    app.kubernetes.io/component: canary-mesh-multi-bookinfo-ingressgateway
  servers:
    - port:
        number: 8080
        name: http
        protocol: HTTP
      hosts:
        - "*"
