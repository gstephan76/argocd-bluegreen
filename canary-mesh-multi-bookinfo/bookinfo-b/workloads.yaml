apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookinfo-b-details
  namespace: canary-mesh-multi-bookinfo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookinfo-b-ratings
  namespace: canary-mesh-multi-bookinfo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookinfo-b-reviews
  namespace: canary-mesh-multi-bookinfo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookinfo-b-productpage
  namespace: canary-mesh-multi-bookinfo
---
apiVersion: v1
kind: Service
metadata:
  name: bookinfo-b-details-stable
  namespace: canary-mesh-multi-bookinfo
  labels:
    app.kubernetes.io/part-of: bookinfo
    app.kubernetes.io/instance: bookinfo-b
    app.kubernetes.io/name: details
    track: stable
spec:
  selector:
    app.kubernetes.io/instance: bookinfo-b
    app.kubernetes.io/name: details
    track: stable
  ports:
    - name: http
      port: 9080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookinfo-b-details-stable
  namespace: canary-mesh-multi-bookinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: bookinfo-b
      app.kubernetes.io/name: details
      track: stable
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /stats/prometheus
        prometheus.io/port: "15090"
      labels:
        app.kubernetes.io/part-of: bookinfo
        app.kubernetes.io/instance: bookinfo-b
        app.kubernetes.io/name: details
        app.kubernetes.io/version: v1
        track: stable
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: bookinfo-b-details
      containers:
        - name: details
          image: quay.io/sail-dev/examples-bookinfo-details-v1:1.20.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9080
---
