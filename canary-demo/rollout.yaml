apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollouts-canary-demo
  namespace: rollouts-canary-demo
spec:
  # Six replicas let the basic (no traffic-router) canary approximate
  # one-third and two-thirds with exact pod ratios: 2/6 and 4/6.
  replicas: 6
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: rollouts-canary-demo
  template:
    metadata:
      labels:
        app: rollouts-canary-demo
      annotations:
        # Changing this pod-template annotation intentionally creates a fresh
        # Rollout revision without changing the demo image.
        demo-rollout-revision: "prometheus-20260922T221056Z-2521906"
    spec:
      containers:
        - name: rollouts-demo
          image: argoproj/rollouts-demo:yellow
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
  strategy:
    canary:
      # Argo Rollouts rewrites this Service selector so it targets only the
      # current canary ReplicaSet. The Blackbox Exporter probes this Service,
      # preventing stable pods from masking a bad canary.
      canaryService: rollouts-canary-demo-canary
      maxUnavailable: 0
      maxSurge: 1
      steps:
        # Basic canary cannot probe an unexposed canary before the first
        # setWeight without a traffic router. Therefore each exposure level
        # is held until its three HTTP-200 measurements succeed.
        - setWeight: 33
        - analysis:
            templates:
              - templateName: rollouts-canary-demo-prometheus

        - setWeight: 66
        - analysis:
            templates:
              - templateName: rollouts-canary-demo-prometheus

        - setWeight: 100
        - analysis:
            templates:
              - templateName: rollouts-canary-demo-prometheus

        # The 100% canary has passed all Prometheus gates but is not declared
        # stable until an operator explicitly promotes this final pause.
        - pause: {}
