apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollouts-canary-demo
  namespace: rollouts-canary-demo
spec:
  replicas: 5
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: rollouts-canary-demo
  template:
    metadata:
      labels:
        app: rollouts-canary-demo
    spec:
      containers:
        - name: rollouts-demo
          image: argoproj/rollouts-demo:yellow
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
  strategy:
    canary:
      # Argo Rollouts rewrites this Service selector so it targets only the
      # current canary ReplicaSet. The Blackbox Exporter probes this Service,
      # preventing stable pods from masking a bad canary.
      canaryService: rollouts-canary-demo-canary
      maxUnavailable: 0
      maxSurge: 1
      steps:
        - setWeight: 20
        - analysis:
            templates:
              - templateName: rollouts-canary-demo-prometheus
        - pause: {}

        - setWeight: 40
        - analysis:
            templates:
              - templateName: rollouts-canary-demo-prometheus
        - pause:
            duration: 20s

        - setWeight: 60
        - analysis:
            templates:
              - templateName: rollouts-canary-demo-prometheus
        - pause:
            duration: 20s

        - setWeight: 80
        - analysis:
            templates:
              - templateName: rollouts-canary-demo-prometheus
        - pause:
            duration: 20s
