apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollouts-canary-blackbox
  namespace: rollouts-canary-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rollouts-canary-blackbox
  template:
    metadata:
      labels:
        app: rollouts-canary-blackbox
    spec:
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.28.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/config/blackbox.yml
          ports:
            - name: http
              containerPort: 9115
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: rollouts-canary-blackbox
