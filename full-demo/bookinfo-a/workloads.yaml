apiVersion: v1
kind: Service
metadata:
  name: bookinfo-a-reviews-stable
  namespace: canary-mesh-full-demo
  labels:
    app.kubernetes.io/part-of: bookinfo
    app.kubernetes.io/instance: bookinfo-a
    app.kubernetes.io/name: reviews
    track: stable
spec:
  selector:
    app.kubernetes.io/instance: bookinfo-a
    app.kubernetes.io/name: reviews
    track: stable
  ports:
  - name: http
    port: 9080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookinfo-a-reviews-stable
  namespace: canary-mesh-full-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: bookinfo-a
      app.kubernetes.io/name: reviews
      track: stable
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /stats/prometheus
        prometheus.io/port: '15090'
      labels:
        app.kubernetes.io/part-of: bookinfo
        app.kubernetes.io/instance: bookinfo-a
        app.kubernetes.io/name: reviews
        app.kubernetes.io/version: v2
        track: stable
        sidecar.istio.io/inject: 'true'
    spec:
      serviceAccountName: bookinfo-a-reviews
      containers:
      - name: reviews
        image: quay.io/sail-dev/examples-bookinfo-reviews-v2:1.20.2
        imagePullPolicy: IfNotPresent
        env:
        - name: LOG_DIR
          value: /tmp/logs
        - name: RATINGS_HOSTNAME
          value: bookinfo-a-ratings-stable
        ports:
        - name: http
          containerPort: 9080
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: wlp-output
          mountPath: /opt/ibm/wlp/output
      volumes:
      - name: tmp
        emptyDir: {}
      - name: wlp-output
        emptyDir: {}
---
