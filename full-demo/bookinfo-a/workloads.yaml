apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookinfo-a-details
  namespace: canary-mesh-full-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookinfo-a-ratings
  namespace: canary-mesh-full-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookinfo-a-reviews
  namespace: canary-mesh-full-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bookinfo-a-productpage
  namespace: canary-mesh-full-demo
---
apiVersion: v1
kind: Service
metadata:
  name: bookinfo-a-details-stable
  namespace: canary-mesh-full-demo
  labels:
    app.kubernetes.io/part-of: bookinfo
    app.kubernetes.io/instance: bookinfo-a
    app.kubernetes.io/name: details
    track: stable
spec:
  selector:
    app.kubernetes.io/instance: bookinfo-a
    app.kubernetes.io/name: details
    track: stable
  ports:
  - name: http
    port: 9080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookinfo-a-details-stable
  namespace: canary-mesh-full-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: bookinfo-a
      app.kubernetes.io/name: details
      track: stable
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /stats/prometheus
        prometheus.io/port: '15090'
      labels:
        app.kubernetes.io/part-of: bookinfo
        app.kubernetes.io/instance: bookinfo-a
        app.kubernetes.io/name: details
        app.kubernetes.io/version: v1
        track: stable
        sidecar.istio.io/inject: 'true'
    spec:
      serviceAccountName: bookinfo-a-details
      containers:
      - name: details
        image: quay.io/sail-dev/examples-bookinfo-details-v1:1.20.2
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9080
---
