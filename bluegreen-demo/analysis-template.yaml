apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: bluegreen-demo-smoke-test
  namespace: bluegreen-demo
spec:
  args:
    - name: preview-url

  metrics:
    - name: preview-http-smoke-test
      provider:
        job:
          metadata:
            labels:
              app: bluegreen-demo-analysis
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 30
            template:
              metadata:
                labels:
                  app: bluegreen-demo-analysis
              spec:
                restartPolicy: Never
                securityContext:
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: smoke-test
                    image: quay.io/curl/curl:8.22.0
                    imagePullPolicy: IfNotPresent
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                      runAsNonRoot: true
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -eu

                        url="{{args.preview-url}}"
                        echo "Pre-promotion smoke test: ${url}"

                        for attempt in 1 2 3; do
                          echo "HTTP check ${attempt}/3"
                          curl                             --fail                             --silent                             --show-error                             --max-time 5                             "${url}"                             >/dev/null
                          sleep 1
                        done

                        echo "Preview HTTP smoke test passed."
