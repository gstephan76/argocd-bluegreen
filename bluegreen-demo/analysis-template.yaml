apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: bluegreen-demo-smoke-test
  namespace: bluegreen-demo
spec:
  args:
    - name: preview-url
    - name: expected-color

  metrics:
    - name: preview-http-and-identity-smoke-test
      provider:
        job:
          metadata:
            labels:
              app: bluegreen-demo-analysis
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 30
            template:
              metadata:
                labels:
                  app: bluegreen-demo-analysis
              spec:
                restartPolicy: Never
                securityContext:
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: smoke-test
                    image: quay.io/curl/curl:8.22.0
                    imagePullPolicy: IfNotPresent
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                      runAsNonRoot: true
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -eu

                        url="{{args.preview-url}}"
                        expected="{{args.expected-color}}"
                        echo "Pre-promotion smoke test: ${url}"
                        echo "Expected candidate color: ${expected}"

                        for attempt in 1 2 3; do
                          echo "HTTP + identity check ${attempt}/3"
                          body="$(
                            curl \
                              --fail \
                              --silent \
                              --show-error \
                              --max-time 5 \
                              "${url}/color"
                          )"
                          echo "Observed /color: ${body}"
                          if [ "${body}" != "\"${expected}\"" ]; then
                            echo "Expected /color to return \"${expected}\", got ${body}" >&2
                            exit 1
                          fi
                          sleep 1
                        done

                        echo "Preview HTTP and identity smoke test passed."
