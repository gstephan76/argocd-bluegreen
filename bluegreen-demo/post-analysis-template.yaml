apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: bluegreen-demo-post-smoke-test
  namespace: bluegreen-demo
spec:
  args:
    - name: active-url
    - name: expected-color

  metrics:
    - name: active-http-and-identity-smoke-test
      provider:
        job:
          metadata:
            labels:
              app: bluegreen-demo-post-analysis
          spec:
            backoffLimit: 0
            # Five checks can consume up to 35 seconds from curl timeout +
            # sleeps alone. Keep enough budget for Job/pod startup overhead.
            activeDeadlineSeconds: 60
            template:
              metadata:
                labels:
                  app: bluegreen-demo-post-analysis
              spec:
                restartPolicy: Never
                securityContext:
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: smoke-test
                    image: quay.io/curl/curl:8.22.0
                    imagePullPolicy: IfNotPresent
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                      runAsNonRoot: true
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -eu

                        url="{{args.active-url}}"
                        expected="{{args.expected-color}}"
                        echo "Post-promotion production smoke test: ${url}"
                        echo "Expected active color: ${expected}"

                        for attempt in 1 2 3 4 5; do
                          echo "HTTP + identity check ${attempt}/5"
                          body="$(
                            curl \
                              --fail \
                              --silent \
                              --show-error \
                              --max-time 5 \
                              "${url}/color"
                          )"
                          echo "Observed /color: ${body}"
                          if [ "${body}" != "\"${expected}\"" ]; then
                            echo "Expected /color to return \"${expected}\", got ${body}" >&2
                            exit 1
                          fi
                          sleep 2
                        done

                        echo "Post-promotion HTTP and identity smoke test passed."
