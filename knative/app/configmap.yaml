apiVersion: v1
kind: ConfigMap
metadata:
  name: httpd-page-v1
  namespace: knative-httpd
  labels:
    app.kubernetes.io/name: httpd-single-page
    app.kubernetes.io/part-of: knative-httpd-demo
    demo.knative.dev/version: v1
immutable: true
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Knative HTTPD Demo - Revision V1</title>
      <style>
        :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #f9fafb; }
        main { width: min(760px, calc(100% - 3rem)); padding: 3rem; border: 1px solid #374151; border-radius: 1rem; background: #1f2937; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
        h1 { margin-top: 0; font-size: clamp(2rem, 6vw, 4rem); }
        p { line-height: 1.6; font-size: 1.1rem; color: #d1d5db; }
        .badge { display: inline-block; padding: .4rem .7rem; border-radius: 999px; background: #1e3a8a; color: #bfdbfe; font-weight: 700; }
      </style>
    </head>
    <body>
      <main>
        <span class="badge">Knative Serving · Revision V1</span>
        <h1>HTTPD is running serverless on OpenShift.</h1>
        <p>This is <strong>Revision V1</strong>.</p>
        <p>Knative Serving can scale this revision to zero when idle and reactivate it on the next HTTP request.</p>
      </main>
    </body>
    </html>
