apiVersion: v1
kind: ConfigMap
metadata:
  name: httpd-page-v2
  namespace: knative-httpd
  labels:
    app.kubernetes.io/name: httpd-single-page
    app.kubernetes.io/part-of: knative-httpd-demo
    demo.knative.dev/version: v2
immutable: true
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Knative HTTPD Demo - Revision V2</title>
      <style>
        :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #052e16; color: #f0fdf4; }
        main { width: min(760px, calc(100% - 3rem)); padding: 3rem; border: 1px solid #166534; border-radius: 1rem; background: #14532d; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
        h1 { margin-top: 0; font-size: clamp(2rem, 6vw, 4rem); }
        p { line-height: 1.6; font-size: 1.1rem; color: #dcfce7; }
        .badge { display: inline-block; padding: .4rem .7rem; border-radius: 999px; background: #166534; color: #dcfce7; font-weight: 700; }
      </style>
    </head>
    <body>
      <main>
        <span class="badge">Knative Serving · Revision V2</span>
        <h1>A new immutable Knative Revision is live.</h1>
        <p>This is <strong>Revision V2</strong>.</p>
        <p>It can be exposed through a tagged candidate URL, receive a percentage of traffic, and then be promoted to 100%.</p>
      </main>
    </body>
    </html>
