apiVersion: v1
kind: Namespace
metadata:
  name: rollouts-mesh-canary-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollouts-mesh-canary-metrics
  namespace: rollouts-mesh-canary-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: rollouts-mesh-canary-prometheus-token
  namespace: rollouts-mesh-canary-demo
  annotations:
    kubernetes.io/service-account.name: rollouts-mesh-canary-metrics
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rollouts-mesh-canary-prometheus-reader
  namespace: openshift-monitoring
subjects:
  - kind: ServiceAccount
    name: rollouts-mesh-canary-metrics
    namespace: rollouts-mesh-canary-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
